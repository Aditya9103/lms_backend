services:
  # ── Redis (Queue & Cache Broker) ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lms_redis_prod
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_network

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_backend_prod
    restart: always
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    networks:
      - lms_network

  # ── BullMQ Background Worker ───────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: lms_worker_prod
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    networks:
      - lms_network

volumes:
  redis_prod_data:
  backend_logs:
  backend_uploads:

networks:
  lms_network:
    driver: bridge
